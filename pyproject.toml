[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "restaurant-scraper-api"
version = "0.1.0"
description = "HTTP API that collects cafe, restaurant and fast-food data from OpenStreetMap and exports it to XLSX, CSV or GeoJSON."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.5",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.1",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

# ─────────────────────────── ruff ───────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # unused arguments
    "SIM",  # flake8-simplify
    "TCH",  # type-checking imports
    "PTH",  # use pathlib
    "RUF",
]
ignore = [
    "B008",  # FastAPI's Depends()/Query() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
# FastAPI and pydantic resolve annotations at runtime to build the dependency graph and model
# schemas, so their imports cannot move into a type-checking block.
"app/api/**" = ["TC001", "TC002", "TC003"]
"app/schemas/**" = ["TC001", "TC002", "TC003"]
"app/main.py" = ["TC003"]
# Tests: fixtures are injected rather than called, and are often requested purely for their
# side effects (patching upstreams).
"tests/**" = ["ARG001", "ARG002", "TC001", "TC002", "TC003"]

# ─────────────────────────── mypy ───────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true

# ─────────────────────────── pytest ───────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
omit = ["app/core/logging.py"]
